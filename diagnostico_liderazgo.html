<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagnóstico de Liderazgo - HR Strategy Partners</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* Estilos Core - Manteniendo tu identidad de marca Master */
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        :root{
            --blue:#1B4E9F;--blue-light:#EEF2FA;
            --violet:#7B5CC4;--violet-light:#F3F0FB;
            --magenta:#C84FAE;--magenta-light:#FCF0F9;
            --teal:#2B8698;--teal-light:#EDF6F8;
            --ink:#0C1630;--ink2:#1E2A4A;--muted:#6B7A99;
            --border:rgba(27,78,159,.12);--off:#F8F7FC;--white:#fff;
            --grad:linear-gradient(135deg,#1B4E9F 0%,#7B5CC4 55%,#C84FAE 100%);
        }
        body{font-family:'Outfit',sans-serif;background:var(--off);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
        
        /* Header & Hero */
        .hdr{background:var(--ink);padding:14px 40px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
        .logo{display:flex;align-items:center;gap:10px;text-decoration:none}
        .lsym{width:34px;height:34px;border-radius:8px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;color:#fff}
        .lname{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#fff}
        .lsub{font-size:8px;color:var(--teal);letter-spacing:1.5px;text-transform:uppercase}
        
        .hero{background:var(--ink);padding:56px 40px 64px;position:relative;overflow:hidden;color:#fff}
        .hi{position:relative;z-index:2;max-width:860px;margin:0 auto}
        .hh1{font-family:"Cormorant Garamond",serif;font-size:clamp(30px,5vw,58px);font-weight:300;line-height:.95;margin-bottom:16px}
        .hh1 em{font-style:italic;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

        /* Question Cards */
        .main{max-width:860px;margin:0 auto;padding:32px 20px 80px}
        .qcard{background:var(--white);border:1px solid var(--border);border-radius:14px;margin-bottom:20px;box-shadow:0 4px 20px rgba(0,0,0,0.05);overflow:hidden}
        .qhead{padding:20px;background:var(--off);border-bottom:1px solid var(--border)}
        .qtext{font-size:16px;font-weight:600;color:var(--ink)}
        .qbody{padding:20px}
        
        /* Options */
        .sopts{display:flex;gap:10px;margin-top:15px}
        .sopt{flex:1;border:2px solid var(--border);border-radius:10px;padding:15px;text-align:center;cursor:pointer;transition:all 0.2s}
        .sopt.sel{border-color:var(--teal);background:var(--teal-light)}
        .sval{font-size:20px;font-weight:700;display:block}
        
        /* UI Progress */
        .progbar{background:#fff;padding:15px 40px;position:sticky;top:62px;z-index:90;border-bottom:1px solid var(--border)}
        .pbtrack{background:var(--border);height:6px;border-radius:10px;margin-top:5px;overflow:hidden}
        .pbfill{background:var(--grad);height:100%;width:0%;transition:width 0.3s}

        /* Result & Form */
        .result{display:none;margin-top:40px}
        .bcalc{width:100%;padding:18px;border-radius:50px;background:var(--magenta);color:#fff;border:none;font-weight:700;cursor:pointer;margin-top:20px}
        .bcalc:disabled{opacity:0.3;cursor:not-allowed}
        
        @media(max-width:600px){ .sopts{display:grid;grid-template-columns:repeat(5, 1fr)} .sopt{padding:10px 5px} }
    </style>
</head>
<body>

<header class="hdr">
    <a href="/" class="logo">
        <div class="lsym">HR</div>
        <div><div class="lname">HR Strategy Partners</div><div class="lsub">Alianzas Estratégicas</div></div>
    </a>
</header>

<section class="hero">
    <div class="hi">
        <h1 class="hh1">Diagnóstico de <strong>Liderazgo</strong><br><em>¿Tu equipo está listo?</em></h1>
        <p>Identifica brechas críticas en 3 minutos.</p>
    </div>
</section>

<div class="progbar">
    <div style="max-width:860px;margin:0 auto">
        <span id="pbc" style="font-size:12px;font-weight:700">Progreso: 0 / 5</span>
        <div class="pbtrack"><div class="pbfill" id="pbf"></div></div>
    </div>
</div>

<main class="main" id="quiz-container">
    </main>

<div class="main">
    <button class="bcalc" id="bcalc" disabled onclick="calcular()">Ver mi diagnóstico ahora</button>

    <div class="result" id="result">
        <div style="background:var(--ink);color:#fff;padding:40px;border-radius:20px;text-align:center">
            <h2 style="font-family:Cormorant Garamond;font-size:40px">Tu Puntaje: <span id="total-score" style="color:var(--teal)">0</span>/25</h2>
            <p id="nivel-texto" style="margin-top:10px;font-weight:600"></p>
        </div>
        <div id="dimensiones-detalle" style="margin-top:30px"></div>
        
        </div>
</div>

<script>
    const preguntas = [
        { d: "Delegación", q: "¿Con qué frecuencia tus líderes delegan tareas sin tu intervención?" },
        { d: "Feedback", q: "¿Tus líderes dan feedback de desempeño de forma regular y clara?" },
        { d: "Autonomía", q: "¿Qué porcentaje de decisiones importantes toman tus gerentes sin consultarte?" },
        { d: "Conflicto", q: "¿Tus líderes resuelven conflictos antes de que lleguen a vos?" },
        { d: "Visión", q: "¿Tus líderes conectan su trabajo con los objetivos estratégicos?" }
    ];

    let respuestas = [0,0,0,0,0];

    function init() {
        const container = document.getElementById('quiz-container');
        preguntas.forEach((p, i) => {
            let html = `
                <div class="qcard">
                    <div class="qhead"><small>DIMENSIÓN: ${p.d}</small><div class="qtext">${p.q}</div></div>
                    <div class="qbody">
                        <div class="sopts">
                            ${[1,2,3,4,5].map(v => `
                                <div class="sopt" onclick="select(${i}, ${v}, this)" id="opt-${i}-${v}">
                                    <span class="sval">${v}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
            container.innerHTML += html;
        });
    }

    function select(pIdx, val, el) {
        respuestas[pIdx] = val;
        // UI logic
        const opts = el.parentElement.querySelectorAll('.sopt');
        opts.forEach(o => o.classList.remove('sel'));
        el.classList.add('sel');
        
        // Progreso
        const completadas = respuestas.filter(r => r > 0).length;
        document.getElementById('pbf').style.width = (completadas / 5 * 100) + '%';
        document.getElementById('pbc').innerText = `Progreso: ${completadas} / 5`;
        
        if(completadas === 5) document.getElementById('bcalc').disabled = false;
    }

    function calcular() {
        const total = respuestas.reduce((a, b) => a + b, 0);
        document.getElementById('total-score').innerText = total;
        document.getElementById('result').style.display = 'block';
        
        let msg = total < 12 ? "ESTADO CRÍTICO: Brechas profundas de autonomía." : 
                  total < 20 ? "ESTADO INTERMEDIO: Potencial de crecimiento moderado." : 
                               "ESTADO SÓLIDO: Equipo de alto rendimiento.";
        
        document.getElementById('nivel-texto').innerText = msg;
        window.scrollTo({top: document.getElementById('result').offsetTop - 100, behavior: 'smooth'});
    }

    init();
</script>

</body>
</html>
